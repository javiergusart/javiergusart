  <text x="92" y="35" font-size="13" fill="#8b949e">readme.md</text>
  <text x="32" y="78" font-size="14"><tspan fill="#d2a8ff">❯</tspan><tspan fill="#3fb950"> cat about.txt</tspan></text>
  <g font-size="14" fill="#e6edf3">
    <text x="32" y="106">into fast, minimal software that respects your</text>
