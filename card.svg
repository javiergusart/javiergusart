    <text x="32" y="154">your attention. just tools that work and get out</text>
    <text x="32" y="178">of the way. simple as that.</text>
    <text x="32" y="214">i ship software, solve problems, and build</text>
    <text x="32" y="238">for the communities i'm part of.</text>
  </g>
  <text x="32" y="274" font-size="14"><tspan fill="#d2a8ff">❯</tspan><tspan fill="#3fb950"> cat now.txt</tspan></text>
  <text x="32" y="310" font-size="14" fill="#e6edf3">missent, a quick little email app.</text>
  <line x1="32" y1="338" x2="648" y2="338" stroke="#21262d" stroke-width="1"/>
